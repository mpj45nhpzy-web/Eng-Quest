<title>English Grammar AI Diagnostics</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#04060f;--card:rgba(9,16,38,.84);--tx:#d6e6ff;--mu:#7f95bf;--pr:#3a8bff;--cy:#3ad0ff;--vi:#8a5cff;--ok:#3dffb0;--bad:#ff4d6d;--bd:#1f3f8f;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:'Kanit','Orbitron',system-ui,sans-serif;line-height:1.65;font-size:16px}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(58,139,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(58,139,255,.07) 1px,transparent 1px);background-size:42px 42px}
#bg{position:fixed;inset:0;z-index:-2;width:100%;height:100%}
header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(4,8,22,.92);border-bottom:1px solid var(--bd);box-shadow:0 0 22px rgba(58,139,255,.35);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(6px)}
h1{font-family:Orbitron,sans-serif;font-size:18px;margin:0;color:var(--cy);letter-spacing:2px;text-shadow:0 0 12px var(--cy)}
h2,h3{font-weight:600;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--pr);background:rgba(58,139,255,.12);color:var(--cy);padding:8px 16px;border-radius:4px;transition:.15s}
button:hover{box-shadow:0 0 14px var(--pr);background:rgba(58,139,255,.25)}button:active{transform:scale(.96)}
nav button{border-color:var(--bd);color:var(--mu);background:transparent}
nav button.on{border-color:var(--cy);color:var(--cy);background:rgba(58,208,255,.14);box-shadow:0 0 12px rgba(58,208,255,.5)}
button.on,button.pr{background:linear-gradient(135deg,#3a8bff,#8a5cff);color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(90,110,255,.6);animation:pulse 2.2s infinite}
main{max-width:760px;margin:0 auto;padding:16px}
main>*{animation:rise .5s both}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:0 0 18px rgba(58,139,255,.18),inset 0 0 22px rgba(58,139,255,.05);animation:rise .5s both}
.card::before,.card::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--cy);pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.grid .card{margin:0;text-align:center}
.les{cursor:pointer;transition:.2s}.les:hover{transform:translateY(-5px);border-color:var(--cy);box-shadow:0 0 26px rgba(58,208,255,.45)}
.emo{font-size:48px;line-height:1.1;filter:drop-shadow(0 0 10px var(--cy))}
.sys{font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:2px;color:var(--cy);text-shadow:0 0 8px var(--cy);margin-bottom:6px}
.sys::after{content:'_';animation:blink 1s steps(1) infinite}
input,select{font:inherit;padding:10px 12px;border-radius:4px;border:1px solid var(--bd);background:#0a1230;color:var(--tx);width:100%}
input:focus,select:focus{outline:none;border-color:var(--cy);box-shadow:0 0 12px rgba(58,208,255,.5)}
select option{background:#0a1230}
#q{margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;letter-spacing:1px}
.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;border:1px solid var(--cy);color:var(--cy);border-radius:3px;padding:1px 10px;margin:2px;font-size:13px}
.f{background:rgba(58,139,255,.1);border-left:3px solid var(--cy);color:#bfe3ff;padding:10px 14px;margin:12px 0;font-family:ui-monospace,monospace;font-size:14px;text-align:left}
.card p{text-align:left}
.opt{display:block;width:100%;text-align:left;margin:7px 0;border:1px solid var(--bd);background:rgba(58,139,255,.06);color:var(--tx)}
.opt:hover{transform:translateX(4px);border-color:var(--cy);background:rgba(58,208,255,.12)}
.opt.on{border-color:var(--cy);background:rgba(58,208,255,.22);color:#fff;box-shadow:0 0 14px rgba(58,208,255,.5)}
.opt.ok{border-color:var(--ok);background:rgba(61,255,176,.18);color:var(--ok);box-shadow:0 0 14px rgba(61,255,176,.5)}
.opt.no{border-color:var(--bad);background:rgba(255,77,109,.18);color:var(--bad)}
.shake{animation:shake .4s}
.bar,.xpb{height:12px;background:#0a1230;border:1px solid var(--bd);border-radius:2px;overflow:hidden}
.bar i,.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 12px var(--cy);animation:fill 1s both}
.xpb{height:8px;width:150px;margin-top:2px}
.hud{display:flex;gap:10px;align-items:center}
.rank{width:40px;height:40px;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-weight:900;font-size:20px;color:var(--c);border:2px solid var(--c);border-radius:6px;box-shadow:0 0 12px var(--c),inset 0 0 10px var(--c);text-shadow:0 0 8px var(--c)}

.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--cy);font-weight:500;letter-spacing:1px}
#modal,#pmodal{position:fixed;inset:0;background:rgba(2,4,12,.94);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .card>div button{flex:1}
.hide{display:none!important}
.big{font-family:Orbitron,sans-serif;font-size:46px;font-weight:900;color:#fff;text-shadow:0 0 16px var(--pr),0 0 34px var(--cy)}
.toast{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:20;background:rgba(5,12,32,.96);border:1px solid var(--cy);padding:10px 16px;box-shadow:0 0 20px rgba(58,208,255,.6);animation:slideIn .4s,out .4s 2.4s forwards}
.toast b{font-family:Orbitron,sans-serif;color:var(--ok);font-size:20px}
#lvup{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,rgba(20,50,140,.88),rgba(2,4,12,.96));animation:flash .6s;cursor:pointer;overflow:hidden}
#lvup .lu{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(34px,10vw,64px);color:#fff;text-shadow:0 0 20px var(--cy),0 0 50px var(--pr);animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
#lvup .ln{font-family:Orbitron,sans-serif;font-size:clamp(48px,16vw,100px);font-weight:900;color:var(--cy);text-shadow:0 0 30px var(--cy);animation:pop 1s .15s both cubic-bezier(.2,1.6,.4,1)}
#lvup .rk svg{vertical-align:middle}.rk{font-family:Orbitron,sans-serif;font-size:22px;color:var(--c);border:2px solid var(--c);padding:4px 18px;margin:12px 0;box-shadow:0 0 20px var(--c);animation:pop 1s .4s both}
.ring{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px;border:3px solid var(--cy);border-radius:50%;animation:ring 1.6s ease-out infinite}.r2{animation-delay:.8s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes blink{50%{opacity:0}}
@keyframes fill{from{width:0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pulse{50%{box-shadow:0 0 26px rgba(90,110,255,.95)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes flash{from{background:#fff}}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(9);opacity:0}}
@keyframes slideIn{from{transform:translateX(120%)}}
@keyframes out{to{opacity:0;transform:translateX(120%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-family:Orbitron,sans-serif;font-weight:700;border:2px solid var(--cy);box-shadow:0 0 10px var(--cy);flex:none;vertical-align:middle}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1}
.acct{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:6px;margin:8px 0;text-align:left}.acct>div{flex:1;min-width:0}
.avpick{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;margin:10px 0}
.hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
details{border:1px solid var(--bd);border-radius:4px;padding:6px 10px;margin:6px 0;text-align:left}summary{cursor:pointer}

<script>
const LV=['ประถม','ม.ต้น','ม.ปลาย','มหาวิทยาลัย/วัยทำงาน'];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LESSONS=[
{id:'tense',t:'Tenses (กาล)',f:'Present Simple: S + V1(s/es) | Past Simple: S + V2 | Present Perfect: S + have/has + V3',why:'ใช้บอกว่าเหตุการณ์เกิดเมื่อไรและเกี่ยวข้องกับปัจจุบันอย่างไร: นิสัย/ความจริง = Present Simple, เหตุการณ์จบแล้ว = Past Simple, เริ่มในอดีตแต่ยังต่อเนื่อง/มีผลถึงตอนนี้ = Present Perfect',pit:'since/for ต้องใช้ Present Perfect ไม่ใช่ Past Simple; ประธานเอกพจน์บุรุษที่ 3 ต้องเติม s',sig:'every day, usually → Present Simple | yesterday, ago, last → Past Simple | since, for, already, yet → Present Perfect',ex:'She works here. / I visited Rome in 2019. / I have lived here since 2020.',m:{q:'We ___ here for ten years.',o:['live','lived','have lived'],a:2,w:'for ten years = ระยะเวลาถึงปัจจุบัน ใช้ Present Perfect'}},
{id:'sva',t:'Subject-Verb Agreement (ประธานกับกริยา)',f:'เอกพจน์ → V + s | พหูพจน์ → V ไม่เติม s | The number of + N → เอกพจน์ | A number of + N → พหูพจน์',why:'กริยาต้องสอดคล้องกับ "ประธานหลัก" ไม่ใช่คำที่อยู่ใกล้กริยาที่สุด',pit:'Neither/Each/Everyone เป็นเอกพจน์; ข้อความคั่นกลางเช่น of the boys ไม่ใช่ประธาน',sig:'each, every, neither, either, the number of, a number of',ex:'Each of the students has a book. / The number of cars is rising.',m:{q:'Everyone ___ ready.',o:['are','is'],a:1,w:'Everyone เป็นเอกพจน์'}},
{id:'cond',t:'If-Clause (Conditionals)',f:'Zero: If + V1, V1 | 1st: If + V1, will + V1 | 2nd: If + V2/were, would + V1 | 3rd: If + had + V3, would have + V3',why:'เลือกแบบตามความเป็นไปได้: จริงเสมอ / เป็นไปได้ในอนาคต / ตรงข้ามปัจจุบัน / ตรงข้ามอดีต',pit:'ห้ามใช้ will ในอนุประโยค if; ใช้ were กับทุกประธานในแบบที่ 2; Inversion: Had I known = If I had known',sig:'unless, provided that, had + S, were + S, if only',ex:'If I were you, I would go. / Had she left earlier, she would have caught the train.',m:{q:'If it rains tomorrow, we ___ at home.',o:['stay','will stay','would stay'],a:1,w:'เหตุการณ์อนาคตที่เป็นไปได้ = แบบที่ 1'}},
{id:'prep',t:'Prepositions (in/on/at)',f:'at + เวลาเฉพาะ/จุด | on + วัน/วันที่/พื้นผิว | in + เดือน/ปี/พื้นที่ใหญ่',why:'บุพบทบอกเวลาและสถานที่ โดยดูจาก "ขนาด/ความเฉพาะเจาะจง"',pit:'in the morning แต่ on Monday morning; at night แต่ in the evening',sig:'o\'clock, Sunday, 2024, July',ex:'at 8 o\'clock / on Friday / in July',m:{q:'The party is ___ Saturday.',o:['in','on','at'],a:1,w:'วันในสัปดาห์ใช้ on'}},
{id:'passive',t:'Passive Voice (ประโยคถูกกระทำ)',f:'S + be + V3 (+ by agent) | will be V3 | has/have been V3 | modal + be + V3',why:'ใช้เมื่อเน้น "ผู้ถูกกระทำ" หรือไม่ทราบ/ไม่จำเป็นต้องระบุผู้กระทำ',pit:'be ต้องเปลี่ยนตามกาลเดิม; กริยาอกรรม (happen, arrive) ทำ passive ไม่ได้',sig:'by + agent, is/was/been + V3',ex:'The window was broken. / The work will be finished.',m:{q:'The letter ___ yesterday.',o:['sent','was sent','is sent'],a:1,w:'yesterday = Past → was + V3'}},
{id:'art',t:'Articles (a/an/the)',f:'a + พยัญชนะ | an + สระ(เสียง) | the = เฉพาะเจาะจง/กล่าวถึงแล้ว',why:'บอกว่าสิ่งนั้นเป็นสิ่งใดสิ่งหนึ่ง (a/an) หรือผู้พูดและผู้ฟังรู้ว่าหมายถึงอะไร (the)',pit:'ดูที่ "เสียง" ไม่ใช่ตัวอักษร: an hour, a university',sig:'first mention → a/an | second mention → the | only, same, superlative → the',ex:'an apple / a university / the sun',m:{q:'She is ___ honest girl.',o:['a','an','the'],a:1,w:'honest ออกเสียงเริ่มด้วยสระ'}},
{id:'rel',t:'Relative Clauses',f:'คน: who/that | สิ่งของ: which/that | เจ้าของ: whose | สถานที่: where',why:'ใช้ขยายคำนามเพื่อเชื่อมสองประโยคให้เป็นหนึ่งเดียว',pit:'ห้ามเว้น who/which ถ้าทำหน้าที่เป็นประธาน; ห้ามใช้ that หลังเครื่องหมายคอมมา',sig:'the man who, the book which, the city where',ex:'The girl who sits there is my sister.',m:{q:'The house ___ roof is red is mine.',o:['who','which','whose'],a:2,w:'เจ้าของ (roof ของ house) ใช้ whose'}},
{id:'modal',t:'Modal Verbs',f:'modal + V1 | must have + V3 (มั่นใจในอดีต) | can\'t have + V3 | should have + V3 (ควรทำแต่ไม่ได้ทำ)',why:'บอกความสามารถ ความจำเป็น ความน่าจะเป็น และคำแนะนำ',pit:'หลัง modal ห้ามเติม to หรือ s; must = มั่นใจ/ข้อบังคับ, have to = จำเป็น',sig:'probably, perhaps, obligation, advice',ex:'You must stop. / He should have called.',m:{q:'She ___ speak three languages.',o:['can','cans','can to'],a:0,w:'modal + V1 เท่านั้น'}}
];
const Q=[
[['art','I have ___ apple.',['a','an','the'],1,'apple ขึ้นต้นด้วยเสียงสระ ใช้ an'],['prep','The book is ___ the table.',['in','on','at'],1,'วางบนพื้นผิวใช้ on'],['tense','She ___ to school every day.',['go','goes','going'],1,'every day + ประธานเอกพจน์ → V+es'],['sva','My friends ___ happy.',['is','are','am'],1,'friends เป็นพหูพจน์'],['prep','School starts ___ 8 o\'clock.',['in','on','at'],2,'เวลาเฉพาะใช้ at']],
[['tense','I ___ him since 2020.',['know','knew','have known'],2,'since → Present Perfect'],['tense','Yesterday we ___ football.',['play','played','have played'],1,'yesterday → Past Simple'],['rel','The man ___ lives next door is a doctor.',['who','which','whose'],0,'ขยายคน เป็นประธาน ใช้ who'],['modal','You ___ wear a helmet. It\'s the rule.',['must','can','may'],0,'กฎบังคับ ใช้ must'],['sva','Neither of the boys ___ here.',['are','is','were'],1,'Neither of → เอกพจน์']],
[['cond','If I ___ rich, I would travel the world.',['am','was','were'],2,'แบบที่ 2 ใช้ were'],['cond','If she had studied, she ___ the exam.',['would pass','would have passed','will pass'],1,'แบบที่ 3 → would have + V3'],['passive','The report ___ by tomorrow.',['will finish','will be finished','is finished'],1,'อนาคต + ถูกกระทำ'],['modal','He ___ have left; his car is still here.',['must','can\'t','should'],1,'ฟันธงว่าเป็นไปไม่ได้ในอดีต'],['passive','English ___ in many countries.',['speaks','is spoken','spoken'],1,'ข้อเท็จจริงปัจจุบัน + ถูกกระทำ']],
[['cond','Had I known, I ___ you.',['would tell','would have told','told'],1,'Had I known = If I had known (แบบที่ 3)'],['cond','It\'s essential that he ___ on time.',['is','be','was'],1,'Subjunctive: that + S + V1'],['cond','If I had taken the job, I ___ in Paris now.',['would live','would be living','would have lived'],1,'Mixed: อดีตส่งผลปัจจุบัน'],['sva','The number of applicants ___ increased.',['have','has','are'],1,'The number of → เอกพจน์'],['modal','Not only ___ late, but he also forgot the files.',['he arrived','did he arrive','he did arrive'],1,'Negative adverb ขึ้นต้น → Inversion']]
];

const DF=[[1,1,1,1,2],[1,2,2,2,2],[2,2,3,3,3],[3,3,3,3,3]];
const EX=[['art','___ sun is hot.',['A','An','The'],2,'สิ่งที่มีหนึ่งเดียวใช้ the',0,1],['sva','The dog ___ barking.',['are','is','am'],1,'dog เอกพจน์ → is',0,1],['tense','We ___ playing now.',['is','are','am'],1,'We + are (Present Continuous)',0,1],
['art','He is ___ best student in class.',['a','an','the'],2,'Superlative ใช้ the',1,2],['prep','I was born ___ July.',['in','on','at'],0,'เดือนใช้ in',1,2],['passive','The cake ___ by my mother.',['made','was made','is making'],1,'ถูกกระทำ อดีต → was + V3',1,2],['rel','The girl ___ I met is nice.',['who','whose','where'],0,'ขยายคน ใช้ who',1,1],['modal','You ___ be quiet in the library.',['should','can','will'],0,'คำแนะนำ/ข้อควรทำ ใช้ should',1,1],
['art','She works at ___ university.',['a','an','the'],0,'university ขึ้นต้นด้วยเสียงพยัญชนะ /ju/ → a',2,2],['prep','He is good ___ math.',['in','at','on'],1,'good at = เก่งเรื่อง',2,2],['sva','Each of the girls ___ a bag.',['have','has','having'],1,'Each of → เอกพจน์',2,2],['cond','If you heat ice, it ___.',['melts','will melt','melted'],0,'Zero Conditional: ความจริงทั่วไป',2,2],['tense','By the time he arrived, we ___ dinner.',['have finished','had finished','finished'],1,'เหตุการณ์ก่อนอดีตอีกเหตุการณ์ → Past Perfect',2,3],['rel','This is the town ___ I grew up.',['where','which','who'],0,'สถานที่ใช้ where',2,2],['modal','I ___ have studied harder; now I failed.',['should','must','can'],0,'เสียดายที่ไม่ได้ทำ → should have + V3',2,3],

function topicCard(title,rs,learn){const S=LESSONS.map(l=>{let c=0,t=0;rs.forEach(r=>{const x=r.topics&&r.topics[l.id];if(x){c+=x[0];t+=x[1]}});return{l,c,t,p:t?Math.round(c/t*100):null}});
if(!S.some(x=>x.t))return `<div class="card"><div class="sys">${title}</div><div class="mu">ยังไม่มีข้อมูลรายบทเรียน (ทำภารกิจใหม่เพื่อสร้างข้อมูล)</div></div>`;
return `<div class="card"><div class="sys">${title}</div><div style="max-width:260px;margin:auto">${radar(S.map(x=>x.p||0),S.map(x=>EM[x.l.id]))}</div>${S.map(x=>`<div style="margin:8px 0;text-align:left;display:flex;gap:8px;align-items:center"><span style="width:26px">${EM[x.l.id]}</span><div style="flex:1"><div>${x.l.t} <span class="mu">${x.t?x.c+'/'+x.t+' ข้อ · '+x.p+'% · '+(x.p>=80?'ชำนาญ':x.p>=50?'กำลังพัฒนา':'ต้องฝึก'):'ยังไม่ได้ทำ'}</span></div><div class="bar"><i style="width:${x.p||0}%"></i></div></div>${learn&&x.t&&x.p<80?`<button onclick="go('learn','${x.l.id}')">เรียน</button>`:''}</div>`).join('')}</div>`}
const IT={hint:{e:'🔍',n:'ตัวช่วยตัดช้อยส์',d:'ตัดตัวเลือกที่ผิดออก 1 ข้อ ใช้ได้ระหว่างภารกิจ',p:30},boost:{e:'🔥',n:'ยาเร่ง EXP x2',d:'EXP ของภารกิจถัดไปได้ x2 (ติ๊กเลือกก่อนเริ่มภารกิจ)',p:60},potion:{e:'🧪',n:'โพชั่น EXP',d:'ใช้แล้วได้ EXP +30 ทันที',p:40},chest:{e:'🎁',n:'กล่องสุ่ม',d:'เปิดแล้วได้เหรียญหรือไอเท็มแบบสุ่ม',p:50}};
function items(){if(!P){$('#app').innerHTML='<div class="card">ไอเท็มสำหรับนักเรียน</div>';return}
$('#app').innerHTML=`<div class="card"><div class="sys">[ INVENTORY ]</div><div class="big">🪙 ${P.coins||0}</div><div class="mu">ได้เหรียญจากภารกิจ และรางวัลเมื่อเลเวลอัป</div></div><div class="grid">${Object.keys(IT).map(k=>`<div class="card"><div class="emo">${IT[k].e}</div><b>${IT[k].n}</b> <span class="tag">x${P.inv[k]||0}</span><div class="mu">${IT[k].d}</div>${k=='potion'||k=='chest'?`<p><button ${P.inv[k]?'':'disabled'} onclick="useIt('${k}')">ใช้เลย</button></p>`:'<p class="mu">ใช้ในหน้าภารกิจ</p>'}</div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="sys">[ SHOP ] ร้านค้า</div>${Object.keys(IT).map(k=>`<div class="acct"><span style="font-size:28px">${IT[k].e}</span><div><b>${IT[k].n}</b><div class="mu">${IT[k].d}</div></div><button class="${(P.coins||0)>=IT[k].p?'pr':''}" onclick="buy('${k}')">🪙 ${IT[k].p}</button></div>`).join('')}</div>`}
function useIt(k){if(!P||!P.inv[k])return;P.inv[k]--;if(k=='potion')gain(30,'ใช้โพชั่น EXP');else{if(Math.random()<.45){const c=20+Math.floor(Math.random()*41);P.coins+=c;toast(`<div class="sys">[ CHEST ]</div>ได้รับ <b>+${c} 🪙</b>`)}else{const x=['hint','hint','boost','potion'][Math.floor(Math.random()*4)];P.inv[x]++;toast(`<div class="sys">[ CHEST ]</div>ได้รับ <b>${IT[x].e} ${IT[x].n}</b>`)}burst()}save();push();hud();items()}
function buy(k){if((P.coins||0)<IT[k].p)return toast('เหรียญไม่พอ');P.coins-=IT[k].p;P.inv[k]=(P.inv[k]||0)+1;save();push();items()}
let RS='all',RL=[];
async function board(){const m={};if(cloud){try{(await cloud.collection('board').get()).docs.forEach(d=>{const v=d.data();if(v&&v.id)m[v.id]=v})}catch(e){}}
acc.filter(a=>a.role=='student').forEach(a=>{const q=LS.get('prog_'+a.id,null);if(q&&!m[a.id])m[a.id]={id:a.id,fn:a.fn,ln:a.ln,av:a.av,lv:q.lv,tot:totXp(q.lv,q.xp),cls:a.cls||''}});
if(U&&U.role=='student'&&P)m[U.id]={id:U.id,fn:U.fn,ln:U.ln,av:U.av,lv:P.lv,tot:totXp(P.lv,P.xp),cls:U.cls||''};return Object.values(m)}
async function rank(){$('#app').innerHTML='<div class="card">กำลังโหลดอันดับ...</div>';RL=await board();drawRank()}
function drawRank(){const f=RS=='cls'&&U.cls?RL.filter(x=>x.cls==U.cls):RL,s=f.slice().sort((a,b)=>b.tot-a.tot);
$('#app').innerHTML=`<div class="tabs"><button class="${RS=='all'?'on':''}" onclick="RS='all';drawRank()">🌍 ทั้งหมด</button>${U.cls?`<button class="${RS=='cls'?'on':''}" onclick="RS='cls';drawRank()">🏫 ห้องของฉัน</button>`:''}<button onclick="rank()">⟳ รีเฟรช</button></div><div class="card"><div class="sys">[ RANKING ] ${cloud?'ผู้เล่นทั้งหมด':'ผู้เล่นในเครื่องนี้'}</div>${s.map((x,i)=>{const r=RK(x.lv);return `<div class="acct" style="${U&&x.id==U.id?'border-color:var(--cy);box-shadow:0 0 14px rgba(58,208,255,.5)':''}"><b style="width:34px;font-family:Orbitron,sans-serif">${i<3?['🥇','🥈','🥉'][i]:i+1}</b>${av(x,36)}<div><b>${esc(x.fn)} ${esc((x.ln||'')[0]||'')}</b><div class="mu">LV ${esc(x.lv)} · ${esc(x.tot)} EXP · ${RN[r]}</div></div>${emb(r,38)}</div>`}).join('')||'<div class="mu">ยังไม่มีผู้เล่น</div>'}</div><div class="card"><div class="sys">[ RANK GUIDE ]</div><div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">${['E','D','C','B','A','S'].map((r,i)=>`<div style="text-align:center">${emb(r,50)}<div class="mu">${RN[r]}<br>LV ${[1,5,10,15,20,25][i]}+</div></div>`).join('')}</div></div>`}
function cleanCode(c){return String(c||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase()}
async function getClass(code){code=cleanCode(code);if(!code)return null;if(cloud){try{const x=await cloud.doc('classes/'+code).get();if(x.exists)return x.data()}catch(e){}}return LS.get('classes',[]).find(c=>c.code==code)||null}
async function myClasses(){const m={};LS.get('classes',[]).filter(c=>c.owner==U.id).forEach(c=>m[c.code]=c);if(cloud){try{(await cloud.collection('classes').where('owner','==',uid).get()).docs.forEach(d=>{const v=d.data();if(v&&v.code){v.code=cleanCode(v.code);m[v.code]=v}})}catch(e){}}return Object.values(m)}
async function mkClass(){const n=$('#cn').value.trim();if(!n)return;const code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''),c={code,name:n.slice(0,40),owner:U.id,ownerName:U.fn,t:Date.now()},l=LS.get('classes',[]);l.push(c);LS.set('classes',l);
if(cloud){try{await cloud.doc('classes/'+code).set({...c,owner:uid})}catch(e){toast('สร้างบนคลาวด์ไม่สำเร็จ (ต้องมีสิทธิ์ Editor) ห้องนี้ใช้ได้เฉพาะเครื่องนี้')}}clsDraw()}
async function clsDraw(){const cs=await myClasses(),b=$('#cls');if(!b)return;const f=$('#fc');if(f)f.innerHTML='<option value="">ทุกห้อง</option>'+cs.map(c=>`<option value="${cleanCode(c.code)}" ${TS.cl==c.code?'selected':''}>${esc(c.name)}</option>`).join('');
b.innerHTML=`<div class="card"><div class="sys">[ CLASSROOM ] ห้องเรียนของฉัน</div>${cs.map(c=>{const k=cleanCode(c.code);return `<div class="acct"><div><b>${esc(c.name)}</b><div class="mu">รหัสห้อง <span class="tag">${k}</span> · นักเรียน ${TD?TD.list.filter(e=>e.p.cls==k).length:0} คน</div></div><button onclick="TS.cl='${k}';$('#fc').value='${k}';draw()">ดูห้องนี้</button><button onclick="chatCode='${k}';go('chat')">💬</button></div>`}).join('')||'<div class="mu">ยังไม่มีห้องเรียน</div>'}<div style="display:flex;gap:6px;margin-top:8px"><input id="cn" placeholder="ชื่อห้อง เช่น ม.2/1" maxlength="40"><button class="pr" onclick="mkClass()">+ สร้างห้อง</button></div><div class="mu" style="margin-top:6px">ให้นักเรียนกรอกรหัสห้องตอนสมัคร หรือในหน้าโปรไฟล์</div></div>`}
async function joinC(){const c=await getClass($('#pcc').value);if(!c)return toast('ไม่พบรหัสห้องเรียน');U.cls=cleanCode(c.code);U.cn=c.name;persist();profile();toast('<div class="sys">[ SYSTEM ]</div>เข้าร่วมห้อง '+esc(c.name)+' แล้ว')}
async function joinFromChat(){const c=await getClass($('#jc').value);if(!c)return toast('ไม่พบรหัสห้องเรียน');U.cls=cleanCode(c.code);U.cn=c.name;persist();chat()}
let chatCode=null,chatUn=null,chatPoll=null,lastSend=0;
function chatStop(){if(chatUn)chatUn();chatUn=null;clearInterval(chatPoll)}
async function chat(){chatStop();const cs=U.role=='teacher'?(await myClasses()).map(c=>({code:cleanCode(c.code),name:c.name})):(U.cls?[{code:cleanCode(U.cls),name:U.cn||U.cls}]:[]);
if(!cs.length){$('#app').innerHTML=`<div class="card"><div class="sys">[ CHAT ]</div>${U.role=='teacher'?'สร้างห้องเรียนที่แท็บศูนย์บัญชาการครูก่อน แล้วห้องพูดคุยจะปรากฏที่นี่':`<p>เข้าร่วมห้องเรียนด้วยรหัสจากคุณครูเพื่อเริ่มพูดคุย</p><div style="display:flex;gap:6px"><input id="jc" placeholder="รหัสห้อง" maxlength="6"><button class="pr" onclick="joinFromChat()">เข้าร่วม</button></div>`}</div>`;return}
if(!cs.some(c=>c.code==chatCode))chatCode=cs[0].code;
$('#app').innerHTML=`<div class="card"><div class="sys">[ CLASS CHAT ] ${cloud?'☁ ออนไลน์':'💾 เครื่องนี้เท่านั้น'}</div>${cs.length>1?`<select onchange="chatCode=this.value;chat()">${cs.map(c=>`<option value="${c.code}" ${c.code==chatCode?'selected':''}>${esc(c.name)} (${c.code})</option>`).join('')}</select>`:`<b>${esc(cs[0].name)}</b> <span class="tag">${cs[0].code}</span>`}<div id="msgs" style="height:46vh;overflow-y:auto;margin:10px 0;display:flex;flex-direction:column;gap:6px"></div><div style="display:flex;gap:6px"><input id="mi" maxlength="200" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key=='Enter')sendMsg()"><button class="pr" onclick="sendMsg()">ส่ง</button></div><div class="mu" style="margin-top:6px">โปรดใช้ภาษาสุภาพ ครูสามารถลบข้อความได้</div></div>`;
if(cloud){try{chatUn=cloud.collection('chat/'+chatCode+'/m').orderBy('t','desc').limit(60).onSnapshot(sn=>showMsgs(sn.docs.map(d=>({id:d.id,...d.data()})).reverse()),()=>{})}catch(e){}}else{const f=()=>showMsgs(LS.get('chat_'+chatCode,[]));f();chatPoll=setInterval(f,3000)}}
let MS=[];
function showMsgs(ms){MS=ms;const el=$('#msgs');if(!el)return;const near=el.scrollHeight-el.scrollTop-el.clientHeight<80;
el.innerHTML=ms.map((m,i)=>{const me=m.uid==U.id;return `<div style="align-self:${me?'flex-end':'flex-start'};max-width:80%;text-align:left"><div class="mu">${m.role=='teacher'?'👩‍🏫 ':''}${esc(m.name)} · ${new Date(m.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}${U.role=='teacher'?` <a style="cursor:pointer;color:var(--bad)" onclick="delMsg(${i})">ลบ</a>`:''}</div><div style="background:${me?'rgba(58,139,255,.3)':'rgba(138,92,255,.2)'};border:1px solid var(--bd);padding:6px 12px;border-radius:12px;word-break:break-word">${esc(m.text)}</div></div>`}).join('')||'<div class="mu">ยังไม่มีข้อความ ลองทักทายเพื่อน ๆ ดู!</div>';
if(near||!el.dataset.i){el.scrollTop=el.scrollHeight;el.dataset.i=1}}
async function sendMsg(){const i=$('#mi'),t=i.value.trim().slice(0,200);if(!t||Date.now()-lastSend<1200)return;lastSend=Date.now();i.value='';const m={uid:U.id,name:U.fn,role:U.role,text:t,t:Date.now()};
if(cloud){try{await cloud.doc('chat/'+chatCode+'/m/'+m.t+'_'+Math.random().toString(36).slice(2,6)).set(m)}catch(e){toast('ส่งข้อความไม่สำเร็จ')}}else{const l=LS.get('chat_'+chatCode,[]);m.id=String(m.t);l.push(m);LS.set('chat_'+chatCode,l.slice(-100));showMsgs(l.slice(-100))}}
async function delMsg(i){const m=MS[i];if(!m)return;if(cloud){try{await cloud.doc('chat/'+chatCode+'/m/'+m.id).delete()}catch(e){}}else{const l=LS.get('chat_'+chatCode,[]).filter(x=>x.id!=m.id);LS.set('chat_'+chatCode,l);showMsgs(l)}}
U=sess?acc.find(a=>a.id==sess)||null:null;if(U)boot();else authUI();cloudInit();
</script></body></html>
